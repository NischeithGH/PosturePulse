# Kickoff stack: PostgreSQL + Adminer + FastAPI (linked to DB).
# From this folder:
#   cp .env.example .env
#   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctai}
      POSTGRES_DB: ${POSTGRES_DB:-projectone}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ctai} -d ${POSTGRES_DB:-projectone}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: ctai-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"


  api:
    build:
      context: ./api
    container_name: ctai-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
